<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dehz Server Optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root" hidden>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">DEHZ</span>
        <span class="brand-name">Server Optimizer</span>
      </div>

      <div class="host" id="serverName">&mdash;</div>

      <div class="topbar-right">
        <div class="mode" id="modePill">
          <span class="mode-label">MODE</span>
          <span class="mode-value" id="modeValue">&mdash;</span>
        </div>
        <div class="score">
          <span class="score-label">HEALTH</span>
          <span class="score-value mono" id="healthScore">--</span>
        </div>
        <button class="close" id="closeBtn" type="button" aria-label="Close">&times;</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-tab="overview" type="button">Overview</button>
      <button class="tab" data-tab="entities" type="button">Entities</button>
      <button class="tab" data-tab="resources" type="button">Resources</button>
      <button class="tab" data-tab="audit" type="button">Config audit</button>
      <button class="tab" data-tab="hitches" type="button">Hitches</button>
      <button class="tab" data-tab="logs" type="button">Logs</button>
      <div class="tabs-meta mono" id="tabsMeta"></div>
    </nav>

    <main class="content" id="content">
      <div class="empty">Loading&hellip;</div>
    </main>

    <footer class="statusbar mono" id="statusbar"></footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h3 id="modalTitle">Confirm</h3>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="modalConfirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
